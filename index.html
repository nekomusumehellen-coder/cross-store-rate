<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>回兴店跨店率</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb;
  --surface-page: #f9f9f7;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --gridline: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;
  --warn-bg: #fff4e5;
  --warn-border: #e8b566;
  --warn-text: #7a4a00;
  /* 卡种分类色（有效套餐用户明细用），固定顺序，八色分类板+其他灰——dataviz skill 校验过的默认配色 */
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100;
  --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #4a3aa7; --cat-8: #e34948;
  --cat-other: #898781;
  /* 当日状态三色：本店预定=绿，跨店预定=红，闲置=灰——直接复用分类色板里的绿/红/其他灰槽位 */
  --status-store: var(--cat-3);
  --status-cross: var(--cat-8);
  --status-idle: var(--cat-other);
  /* 锁座订单预定方式两色：代客下单锁座=紫，小程序下单锁座=蓝——避开跟当日状态的绿/红/灰撞色 */
  --booking-offline: var(--cat-7);
  --booking-online: var(--cat-1);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --surface-page: #0d0d0d;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --gridline: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --warn-bg: #2e2410;
    --warn-border: #a97a1f;
    --warn-text: #e8b566;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
    --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
    --cat-other: #898781;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19;
  --surface-page: #0d0d0d;
  --text-primary: #ffffff;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --gridline: #2c2c2a;
  --baseline: #383835;
  --border: rgba(255,255,255,0.10);
  --series-1: #3987e5;
  --warn-bg: #2e2410;
  --warn-border: #a97a1f;
  --warn-text: #e8b566;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500;
  --cat-5: #d55181; --cat-6: #008300; --cat-7: #9085e9; --cat-8: #e66767;
  --cat-other: #898781;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text-primary);
  background: var(--surface-page);
}
.wrap { max-width: 980px; margin: 0 auto; padding: 28px 20px 48px; }
h1 { font-size: 20px; margin: 0 0 4px; }
.subtitle { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 20px; }
.controls label { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.controls input[type="date"] {
  font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-primary);
}
.presets { display: flex; gap: 6px; }
.presets button {
  font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-secondary); cursor: pointer;
}
.presets button:hover { background: var(--gridline); }
.presets button.active { background: var(--series-1); color: white; border-color: var(--series-1); }
.kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.kpi-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 24px; overflow-x: auto; }
.card h2 { font-size: 15px; margin: 0 0 4px; }
.card .desc { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 16px; }
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.gridline { stroke: var(--gridline); stroke-width: 1; }
.axis-label { fill: var(--text-muted); font-size: 11px; }
.line-path { fill: none; stroke: var(--series-1); stroke-width: 2; }
.dot { fill: var(--series-1); cursor: pointer; }
.crosshair { stroke: var(--baseline); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
.tooltip {
  position: fixed; pointer-events: none; background: var(--text-primary); color: var(--surface-1);
  font-size: 12px; padding: 6px 10px; border-radius: 6px; opacity: 0; transition: opacity .08s;
  z-index: 10; line-height: 1.5; white-space: nowrap;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--text-secondary); font-weight: 500; font-size: 12px; padding: 6px 10px; border-bottom: 1px solid var(--baseline); }
td { padding: 6px 10px; border-bottom: 1px solid var(--gridline); }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
.empty { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }
.scroll-table { max-height: 400px; overflow-y: auto; }
.warn { background: var(--warn-bg, #fff4e5); border: 1px solid var(--warn-border, #e8b566); color: var(--warn-text, #7a4a00); font-size: 12.5px; padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
.detail-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.detail-controls input[type="text"] {
  font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px;
  border: 1px solid var(--baseline); background: var(--surface-page); color: var(--text-primary);
}
button.toggle {
  font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--baseline); background: var(--surface-page); color: var(--text-secondary); cursor: pointer;
}
button.toggle.active { background: var(--series-1); color: white; border-color: var(--series-1); }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--gridline); color: var(--text-secondary); }
.tag-store { background: color-mix(in srgb, var(--status-store) 25%, var(--surface-1)); color: var(--status-store); font-weight: 600; }
.tag-cross { background: color-mix(in srgb, var(--status-cross) 25%, var(--surface-1)); color: var(--status-cross); font-weight: 600; }
.tag-idle { background: var(--gridline); color: var(--text-muted); }
.tag-offline { background: color-mix(in srgb, var(--booking-offline) 25%, var(--surface-1)); color: var(--booking-offline); font-weight: 600; }
.tag-online { background: color-mix(in srgb, var(--booking-online) 25%, var(--surface-1)); color: var(--booking-online); font-weight: 600; }
/* 卡种分类色行底纹 + 占比条形统计 */
.card-row { background-color: color-mix(in srgb, var(--row-color, var(--cat-other)) 16%, var(--surface-1)); }
.card-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--row-color, var(--cat-other)); vertical-align: middle; }
.comp-legend-svg { width: 100%; height: auto; display: block; overflow: visible; margin-bottom: 8px; }
.comp-item { cursor: pointer; }
.comp-item:hover .comp-seg { filter: brightness(1.1); }
.comp-item.selected .comp-seg { stroke: var(--text-primary); stroke-width: 3; }
.comp-item:focus-visible .comp-seg { outline: 2px solid var(--text-primary); outline-offset: 1px; }
.comp-seg { stroke: var(--surface-1); stroke-width: 2; }
.comp-pct { fill: #fff; font-size: 12px; font-weight: 700; paint-order: stroke; stroke: rgba(0,0,0,0.55); stroke-width: 3; stroke-linejoin: round; pointer-events: none; }
.comp-leader { stroke: var(--baseline); stroke-width: 1; }
.comp-label { fill: var(--text-secondary); font-size: 11px; }
.comp-label .name { fill: var(--text-primary); font-weight: 600; }
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-primary);
  background: var(--gridline); border-radius: 999px; padding: 4px 6px 4px 12px; margin-bottom: 14px;
}
.filter-chip button {
  font: inherit; line-height: 1; width: 18px; height: 18px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--baseline); color: var(--text-primary);
}
</style>
</head>
<body>
<div class="wrap">
  <h1>回兴店跨店率</h1>
  <p class="subtitle">跨店率 = 当天跨店结算(流出方向)涉及的用户数 ÷ 当前持有有效套餐的会员总数。每天北京时间 00:30 自动结算"前一天"的数据(跨店结算要过凌晨才算完)。</p>

  <div class="controls">
    <div class="presets" id="presets"></div>
    <label>起始 <input type="date" id="startDate" /></label>
    <label>结束 <input type="date" id="endDate" /></label>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="card">
    <h2>跨店率趋势</h2>
    <p class="desc">鼠标悬停查看某一天的具体数值</p>
    <div id="chartArea"></div>
  </div>

  <div class="card">
    <h2>有效套餐数量趋势</h2>
    <p class="desc">当天持有有效套餐的会员数(跨店率的分母)，鼠标悬停查看具体数值</p>
    <div id="chartAreaDenom"></div>
  </div>

  <div class="card">
    <h2>锁座用户趋势</h2>
    <p class="desc">当天有"锁座订单"覆盖的用户数——锁座订单指单笔订座订单的时间跨度超过3天（不看卡种，
    普通卡/锁座卡都算，只要一笔订单订的时间够长），已取消的订单不算。鼠标悬停查看具体数值</p>
    <div id="chartAreaLocked"></div>
  </div>

  <div class="card">
    <h2>明细数据</h2>
    <div class="scroll-table" id="tableArea"></div>
  </div>

  <div class="card" id="userDetailCard">
    <h2>有效套餐用户明细（本地专用，含手机号）</h2>
    <div id="userDetailBody"></div>
  </div>

  <div class="card" id="lockedOrderCard">
    <h2>锁座订单明细（本地专用，含手机号）</h2>
    <div id="lockedOrderBody"></div>
  </div>

  <div class="tooltip" id="tt"></div>
</div>

<!-- history.js 里就是一行 window.HISTORY_DATA = [...]，跟 history.json 内容一样。
     用 <script src> 加载而不是 fetch('./history.json')，是因为本地双击打开这个文件时，
     fetch 读同目录文件会被浏览器的本地文件 CORS 限制挡住、读不到数据；script 标签没有这个限制，
     本地双击和挂在网上（GitHub Pages）都能正常显示。 -->
<script src="./history.js"></script>
<!-- local-detail-data.js 含真实客户手机号，加入了 .gitignore，从不提交/不会出现在 GitHub Pages 上。
     本地跑过 `node gen-local-detail.js` 之后这个文件才会存在——线上这个 <script> 请求会 404，
     不会报错、也不会泄露任何东西，下面 userDetailData 拿到的就是空值，明细区自动显示"本地未生成数据"。
     本地双击打开、且已生成过数据的话，这里能正常读到数据显示明细表格。 -->
<script src="./local-detail-data.js" onerror="window.__localDetailMissing = true"></script>
<script>
// 记住上次在页面里选的各种选项（日期区间/搜索词/打码开关/筛选等），下次打开自动恢复——
// 2026-08-13 用户要求的。存在浏览器的 localStorage 里，按 key 分别存，出错(比如隐私模式禁用了
// localStorage)就静默降级成"不记住"，不影响页面正常使用。
const LS_PREFIX = 'crossStoreRate.';
function lsGet(key, fallback) {
  try {
    const v = localStorage.getItem(LS_PREFIX + key);
    return v === null ? fallback : JSON.parse(v);
  } catch { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); } catch {}
}

let ALL_DATA = [];

function loadData() {
  ALL_DATA = (window.HISTORY_DATA || []).slice();
  ALL_DATA.sort((a, b) => (a.date < b.date ? -1 : 1));
  initControls();
  render();
}

function initControls() {
  const startInput = document.getElementById('startDate');
  const endInput = document.getElementById('endDate');
  if (ALL_DATA.length) {
    startInput.value = ALL_DATA[0].date;
    endInput.value = ALL_DATA[ALL_DATA.length - 1].date;
  }
  startInput.addEventListener('change', () => {
    setActivePreset(null);
    lsSet('startDate', startInput.value); lsSet('endDate', endInput.value); lsSet('preset', null);
    render();
  });
  endInput.addEventListener('change', () => {
    setActivePreset(null);
    lsSet('startDate', startInput.value); lsSet('endDate', endInput.value); lsSet('preset', null);
    render();
  });

  const presets = [
    ['近7天', 7], ['近30天', 30], ['全部', null],
  ];
  const presetsEl = document.getElementById('presets');
  let restoredPresetBtn = null;
  const savedPreset = lsGet('preset', null);
  presets.forEach(([label, days]) => {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.addEventListener('click', () => {
      if (!ALL_DATA.length) return;
      const endDate = ALL_DATA[ALL_DATA.length - 1].date;
      let startDate = ALL_DATA[0].date;
      if (days) {
        const d = new Date(endDate);
        d.setDate(d.getDate() - (days - 1));
        startDate = d.toISOString().slice(0, 10);
      }
      startInput.value = startDate;
      endInput.value = endDate;
      setActivePreset(btn);
      lsSet('startDate', startDate); lsSet('endDate', endDate); lsSet('preset', label);
      render();
    });
    presetsEl.appendChild(btn);
    if (label === savedPreset) restoredPresetBtn = btn;
  });

  // 恢复上次的选择：优先按保存的预设按钮重新点一遍（自动带出正确的起止日期）；
  // 没有保存过预设、但保存过自定义起止日期的话，直接套用那两个日期（不算任何预设选中）
  if (restoredPresetBtn) {
    restoredPresetBtn.click();
  } else {
    const savedStart = lsGet('startDate', null);
    const savedEnd = lsGet('endDate', null);
    if (savedStart) startInput.value = savedStart;
    if (savedEnd) endInput.value = savedEnd;
  }
}

function setActivePreset(btn) {
  document.querySelectorAll('.presets button').forEach((b) => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

function getFiltered() {
  const start = document.getElementById('startDate').value;
  const end = document.getElementById('endDate').value;
  return ALL_DATA.filter((d) => (!start || d.date >= start) && (!end || d.date <= end));
}

function render() {
  const data = getFiltered();
  renderKpis(data);
  renderChart(data);
  renderDenomChart(data);
  renderLockedChart(data);
  renderTable(data);
}

// ---- 有效套餐用户明细（本地专用）----
const maskPhone = (p) => (p && p.length >= 7) ? p.slice(0, 3) + '****' + p.slice(-4) : (p || '');
let userDetailMask = lsGet('userDetailMask', true);
let cardColorMap = {}; // cardName -> 颜色（前8名用 var(--cat-1..8)，第9名开始用程序生成的备用色，不折叠进"其他"）
let selectedCardName = lsGet('selectedCardName', null); // 点了卡种条形统计某个色块时选中的卡名，用来筛选下方表格；再点一次/点×清空
let selectedStatusKind = lsGet('selectedStatusKind', null); // 点了当日状态条形统计某个色块时选中的状态('store'/'cross'/'idle')，可以跟卡种筛选叠加

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// 第9种及以后的卡种，用固定公式生成颜色，不再折叠进灰色"其他"（2026-08-11 用户明确要求所有卡名都要
// 直接展示，不要有"其他"这一项）。用黄金角分布哈希色相，保证相邻生成色也尽量分得开。
function extraCategoricalColor(indexBeyond8) {
  const hue = (137.508 * (indexBeyond8 + 1)) % 360;
  return `hsl(${hue.toFixed(1)}, 58%, 45%)`;
}

// 卡种颜色按"全量数据里出现频率"固定分配一次，不随当前筛选变化——
// 保证筛选切换时同一张卡的颜色不会跳变（dataviz skill：颜色要跟着实体走，不能跟着排名走）。
// 出现次数最多的前8种用 dataviz skill 校验过的分类色板，第9种开始用 extraCategoricalColor 生成。
function buildCardColorMap(allRecords) {
  const counts = {};
  for (const r of allRecords) {
    const name = r.cardName || '(未命名)';
    counts[name] = (counts[name] || 0) + 1;
  }
  const ranked = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const map = {};
  ranked.forEach((name, i) => {
    map[name] = i < 8 ? `var(--cat-${i + 1})` : extraCategoricalColor(i - 8);
  });
  return map;
}

function initUserDetailCard() {
  const body = document.getElementById('userDetailBody');
  const records = window.LOCAL_DETAIL_DATA;
  if (!records) {
    body.innerHTML = `
      <p class="desc">本地未生成数据——线上看板不含这块内容，只有本地跑过生成脚本才能看到。</p>
      <div class="warn">在 <code>cross-store-rate</code> 目录下跑：<code>FUNC_SHARED_SECRET=xxx node gen-local-detail.js</code>，
      跑完刷新这个页面即可看到明细（生成的数据文件 <code>local-detail-data.js</code> 只存在本地，不会被提交/公开）。</div>
    `;
    return;
  }
  cardColorMap = buildCardColorMap(records);
  const genDate = window.LOCAL_DETAIL_GENERATED_AT || '未知日期';
  const savedDetailDate = lsGet('detailDate', genDate);
  const savedDetailSearch = lsGet('detailSearch', '');
  body.innerHTML = `
    <div class="warn">⚠️ 这块含真实客户手机号，只在本地看，别截图/公开分享——数据生成于 ${genDate}（想看最新的重新跑一次
    <code>node gen-local-detail.js</code>），共 ${records.length} 条购买/验券记录。</div>
    <div class="detail-controls">
      <label>查看日期 <input type="date" id="detailDate" value="${escapeHtml(savedDetailDate)}" /></label>
      <label>手机号/昵称筛选 <input type="text" id="detailSearch" placeholder="模糊搜索" value="${escapeHtml(savedDetailSearch)}" /></label>
      <button class="toggle${userDetailMask ? ' active' : ''}" id="detailMaskBtn">${userDetailMask ? '手机号已打码' : '手机号明文'}</button>
    </div>
    <div class="kpi-row" id="detailKpiRow" style="grid-template-columns: repeat(2, 1fr); max-width: 480px;"></div>
    <p class="desc" style="margin-top:4px;">下面这行条形统计是当前筛选条件下（查看日期+搜索）有效套餐按卡种的占比，
    从左到右按数量从多到少排列，颜色跟明细表格每行的底色是同一套，直线指向对应的卡名和具体数量；
    点击某个色块可以筛选出该卡种的用户明细，再点一次/点筛选条上的×取消筛选</p>
    <div id="compArea"></div>
    <p class="desc" style="margin-top:4px;">这行是"当日状态"的占比：绿色=本店预定，红色=跨店预定，灰色=闲置
    （含"已闲置N天"和"无历史订座记录"）。点击色块同样可以筛选下方表格，可以跟上面的卡种筛选叠加一起用</p>
    <div id="statusCompArea"></div>
    <div id="statusCardCompWrap"></div>
    <div class="scroll-table" id="detailTableArea"></div>
  `;
  document.getElementById('detailDate').addEventListener('change', (e) => { lsSet('detailDate', e.target.value); renderUserDetail(); });
  document.getElementById('detailSearch').addEventListener('input', (e) => { lsSet('detailSearch', e.target.value); renderUserDetail(); });
  const maskBtn = document.getElementById('detailMaskBtn');
  maskBtn.addEventListener('click', () => {
    userDetailMask = !userDetailMask;
    maskBtn.textContent = userDetailMask ? '手机号已打码' : '手机号明文';
    maskBtn.classList.toggle('active', userDetailMask);
    lsSet('userDetailMask', userDetailMask);
    renderUserDetail();
  });
  renderUserDetail();
}

function renderUserDetail() {
  const records = window.LOCAL_DETAIL_DATA;
  if (!records) return;
  const dateStr = document.getElementById('detailDate').value;
  const q = document.getElementById('detailSearch').value.trim().toLowerCase();

  const validToday = dateStr ? records.filter((r) => r.start <= dateStr && dateStr <= r.end) : records;
  const filtered = q
    ? validToday.filter((r) => (r.phone || '').includes(q) || (r.nickName || '').toLowerCase().includes(q))
    : validToday;
  // 每条记录当日状态只算一次，卡种条形统计/当日状态条形统计/表格三处共用，不用重复算
  const withStatus = filtered.map((r) => ({ r, status: dateStr ? computeDayStatus(r.phone, dateStr) : { text: '—', kind: 'idle' } }));

  // 两条条形统计都始终基于"查看日期+搜索"这两个筛选，不受"点色块选中的卡种/当日状态"影响——
  // 这样切换选中项的时候，两边都能一直看到完整的占比分布做对比
  renderCardComposition(filtered);
  renderStatusComposition(withStatus);

  // 点了"当日状态"的某个色块之后，在它下面再多一条"这个状态筛选下的卡种占比"条形统计——
  // 跟最上面那条卡种条形统计不一样，这条是限定在选中状态范围内的，帮助看"闲置的人主要是哪些卡种"
  // 这种问题。这条也是点色块筛选表格，用的是同一个 selectedCardName，两条卡种条形统计联动。
  const statusCardWrap = document.getElementById('statusCardCompWrap');
  if (selectedStatusKind) {
    const withinStatus = withStatus.filter((e) => e.status.kind === selectedStatusKind).map((e) => e.r);
    statusCardWrap.innerHTML = `
      <p class="desc" style="margin-top:4px;">"${STATUS_KIND_META[selectedStatusKind].label}"这个状态下，卡种占比：</p>
      <div id="statusCardCompArea"></div>
    `;
    renderCardComposition(withinStatus, 'statusCardCompArea', 'statusCard');
  } else {
    statusCardWrap.innerHTML = '';
  }

  // 表格 + KPI 在此基础上叠加"选中的卡种"+"选中的当日状态"两个筛选（可以同时生效）
  let tableEntries = withStatus;
  if (selectedCardName) tableEntries = tableEntries.filter((e) => (e.r.cardName || '(未命名)') === selectedCardName);
  if (selectedStatusKind) tableEntries = tableEntries.filter((e) => e.status.kind === selectedStatusKind);
  const uniqueUsers = new Set(tableEntries.map((e) => e.r.phone)).size;
  const filterNote = (selectedCardName || selectedStatusKind) ? '（已筛选）' : '';

  document.getElementById('detailKpiRow').innerHTML = `
    <div class="kpi"><div class="kpi-label">${dateStr || '全部'} 有效套餐记录数${filterNote}</div><div class="kpi-value">${tableEntries.length}</div></div>
    <div class="kpi"><div class="kpi-label">涉及用户数(去重)</div><div class="kpi-value">${uniqueUsers}</div></div>
  `;

  const el = document.getElementById('detailTableArea');
  if (!tableEntries.length) {
    el.innerHTML = '<div class="empty">这个条件下没有数据</div>';
    return;
  }
  const sorted = [...tableEntries].sort((a, b) => (a.r.phone < b.r.phone ? -1 : a.r.phone > b.r.phone ? 1 : (a.r.start < b.r.start ? -1 : 1)));
  const rows = sorted.map(({ r, status }) => {
    const color = cardColorMap[r.cardName || '(未命名)'] || 'var(--cat-1)';
    return `
    <tr class="card-row" style="--row-color: ${color}">
      <td>${userDetailMask ? maskPhone(r.phone) : r.phone}</td>
      <td>${r.nickName || ''}</td>
      <td><span class="card-dot" style="--row-color: ${color}"></span>${r.cardName || ''}</td>
      <td><span class="tag">${r.source === 'purchase' ? '小程序内购买' : '第三方验券'}</span></td>
      <td class="num">${r.start}</td>
      <td class="num">${r.end}</td>
      <td><span class="tag tag-${status.kind}">${status.text}</span></td>
    </tr>
  `;
  }).join('');
  el.innerHTML = `
    <table>
      <thead><tr><th>手机号</th><th>昵称</th><th>卡名</th><th>来源</th><th class="num">生效日期</th><th class="num">失效日期</th><th>当日状态</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// "当日状态"：拿 gen-local-detail.js 生成的 window.LOCAL_ACTIVITY_DATA（跨店结算+本店订座历史，
// 按手机号整理成日期集合）跟"查看日期"比对：
// - 当天在跨店结算(流出方向)记录里出现 → "跨店预定"
// - 当天在回兴店本店订座记录里出现(已剔除已取消的) → "本店预定"
// - 两边当天都没有 → 找这个人在"查看日期"之前最近一次(跨店或本店)有记录的日期，
//   算相差天数显示"已闲置N天"；如果这个人从来没有任何跨店/本店记录，显示"无历史订座记录"
function daysBetween(earlierDateStr, laterDateStr) {
  const a = new Date(earlierDateStr + 'T00:00:00Z');
  const b = new Date(laterDateStr + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}

// kind 只有三种取值，对应当日状态条形统计的三个固定色块：
// 'store'(本店预定,绿) / 'cross'(跨店预定,红) / 'idle'(闲置,灰——包含"已闲置N天"和"无历史订座记录")
function computeDayStatus(phone, dateStr) {
  const activity = window.LOCAL_ACTIVITY_DATA;
  if (!activity) return { text: '未生成数据', kind: 'idle' };
  const settle = activity.settlement[phone] || [];
  const book = activity.booking[phone] || [];
  if (settle.includes(dateStr)) return { text: '跨店预定', kind: 'cross' };
  if (book.includes(dateStr)) return { text: '本店预定', kind: 'store' };
  let lastDate = null;
  for (const d of settle) { if (d < dateStr && (!lastDate || d > lastDate)) lastDate = d; }
  for (const d of book) { if (d < dateStr && (!lastDate || d > lastDate)) lastDate = d; }
  if (!lastDate) return { text: '无历史订座记录', kind: 'idle' };
  return { text: `已闲置${daysBetween(lastDate, dateStr)}天`, kind: 'idle' };
}

// 通用的"占比条形统计"绘制函数：items = [{key, label, count, color}]，画一条100%堆叠横条，
// 从左到右按数量从多到少排列，百分比写在色块中间（太窄放不下就不硬塞），色块下方拉一根线
// （长短交替错开，避免窄色块的标签挤在一起）指到"标签 (数量)"。点色块回调 onToggle(key) 去
// 切换筛选，再点一次同一个色块/点筛选条上的×取消。containerId 是挂载点 id，selectedKey 是
// 当前选中的 key（未选中传 null），idPrefix 用来生成不重复的清除按钮 id（同一页有两条条形统计）。
function renderCompositionBar(containerId, items, selectedKey, onToggle, ariaLabel, idPrefix) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = '';
    return;
  }
  const sorted = [...items].sort((a, b) => b.count - a.count); // 从多到少
  const total = sorted.reduce((s, it) => s + it.count, 0);

  const W = 1000, gap = 4, n = sorted.length;
  const totalGap = gap * Math.max(0, n - 1);
  const usableW = W - totalGap;
  let cursorX = 0;
  const barY = 10, barH = 32;
  const groups = [];
  sorted.forEach((it, i) => {
    const w = (it.count / total) * usableW;
    const cx = cursorX + w / 2;
    const pct = Math.round((it.count / total) * 1000) / 10;
    const tier = i % 2; // 长短交替错开标签，减少窄色块标签互相重叠
    const lineEndY = tier === 0 ? barY + barH + 14 : barY + barH + 34;
    const labelY = lineEndY + 13;
    const showInlinePct = w > 42; // 色块太窄放不下百分比文字就不硬塞
    const isSelected = selectedKey === it.key;
    groups.push(`
      <g class="comp-item${isSelected ? ' selected' : ''}" data-key="${escapeHtml(it.key)}" role="button" tabindex="0" aria-label="筛选：${escapeHtml(it.label)}">
        <rect class="comp-seg" x="${cursorX.toFixed(2)}" y="${barY}" width="${Math.max(w, 0).toFixed(2)}" height="${barH}" rx="3" fill="${it.color}"></rect>
        ${showInlinePct ? `<text class="comp-pct" x="${cx.toFixed(2)}" y="${(barY + barH / 2 + 4).toFixed(2)}" text-anchor="middle">${pct}%</text>` : ''}
        <line class="comp-leader" x1="${cx.toFixed(2)}" y1="${barY + barH}" x2="${cx.toFixed(2)}" y2="${lineEndY}"></line>
        <circle cx="${cx.toFixed(2)}" cy="${lineEndY}" r="3" fill="${it.color}"></circle>
        <text class="comp-label" x="${cx.toFixed(2)}" y="${labelY}" text-anchor="middle">
          <tspan class="name">${escapeHtml(it.label)}</tspan> <tspan>(${it.count})</tspan>
        </text>
      </g>
    `);
    cursorX += w + gap;
  });

  const clearBtnId = `${idPrefix}ClearFilter`;
  el.innerHTML = `
    <svg viewBox="0 0 ${W} 110" class="comp-legend-svg" role="img" aria-label="${ariaLabel}">
      ${groups.join('')}
    </svg>
    ${selectedKey ? `<div class="filter-chip">筛选中：${escapeHtml(sorted.find((it) => it.key === selectedKey).label)} <button id="${clearBtnId}" aria-label="清除筛选">×</button></div>` : ''}
  `;

  el.querySelectorAll('.comp-item').forEach((g) => {
    g.addEventListener('click', () => onToggle(g.getAttribute('data-key')));
    g.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(g.getAttribute('data-key')); }
    });
  });
  const clearBtn = document.getElementById(clearBtnId);
  if (clearBtn) clearBtn.addEventListener('click', () => onToggle(selectedKey)); // 再传一次同一个key等于toggle掉
}

// containerId/idPrefix 有默认值，正常场景（最上面那条全量卡种条形统计）不用传；
// 点了当日状态色块之后额外冒出来的"这个状态下的卡种占比"那条会传 'statusCardCompArea'/'statusCard'
// 复用同一份逻辑，避免两条卡种条形统计各写一遍——两条共用同一个 selectedCardName，点哪条的色块都行，
// 状态互相同步。
function renderCardComposition(filtered, containerId, idPrefix) {
  const counts = {};
  for (const r of filtered) {
    const name = r.cardName || '(未命名)';
    counts[name] = (counts[name] || 0) + 1;
  }
  const items = Object.keys(counts).map((name) => ({
    key: name, label: name, count: counts[name], color: cardColorMap[name] || 'var(--cat-1)',
  }));
  renderCompositionBar(containerId || 'compArea', items, selectedCardName, (key) => {
    selectedCardName = selectedCardName === key ? null : key;
    lsSet('selectedCardName', selectedCardName);
    renderUserDetail();
  }, '有效套餐按卡种占比，点击色块可筛选下方表格', idPrefix || 'card');
}

// 当日状态三色固定：本店预定=绿，跨店预定=红，闲置=灰（"已闲置N天"+"无历史订座记录"归一类）
const STATUS_KIND_META = {
  store: { label: '本店预定', color: 'var(--status-store)' },
  cross: { label: '跨店预定', color: 'var(--status-cross)' },
  idle: { label: '闲置', color: 'var(--status-idle)' },
};

function renderStatusComposition(withStatus) {
  const counts = { store: 0, cross: 0, idle: 0 };
  for (const { status } of withStatus) counts[status.kind]++;
  const items = Object.keys(counts)
    .filter((k) => counts[k] > 0)
    .map((k) => ({ key: k, label: STATUS_KIND_META[k].label, count: counts[k], color: STATUS_KIND_META[k].color }));
  renderCompositionBar('statusCompArea', items, selectedStatusKind, (key) => {
    selectedStatusKind = selectedStatusKind === key ? null : key;
    lsSet('selectedStatusKind', selectedStatusKind);
    renderUserDetail();
  }, '有效套餐用户当日状态占比，点击色块可筛选下方表格', 'status');
}

function renderKpis(data) {
  const kpiRow = document.getElementById('kpiRow');
  if (!data.length) {
    kpiRow.innerHTML = '';
    return;
  }
  const latest = data[data.length - 1];
  const avg = data.reduce((s, d) => s + d.rate, 0) / data.length;
  const maxRow = data.reduce((a, b) => (b.rate > a.rate ? b : a));
  kpiRow.innerHTML = `
    <div class="kpi"><div class="kpi-label">最新一天(${latest.date})</div><div class="kpi-value">${latest.rate}%</div></div>
    <div class="kpi"><div class="kpi-label">区间平均</div><div class="kpi-value">${avg.toFixed(2)}%</div></div>
    <div class="kpi"><div class="kpi-label">区间最高(${maxRow.date})</div><div class="kpi-value">${maxRow.rate}%</div></div>
  `;
}

// 通用折线图：containerId 挂载点，valueKey 取哪个字段画线，fmtTick/fmtTooltip 控制文案
function drawLineChart(containerId, data, { valueKey, fmtTick, fmtTooltip, ariaLabel, niceStep = 5 }) {
  const chartArea = document.getElementById(containerId);
  if (data.length < 1) {
    chartArea.innerHTML = '<div class="empty">这个区间还没有数据</div>';
    return;
  }
  const W = 920, H = 320;
  const padL = 44, padR = 16, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(niceStep * 2, Math.ceil(Math.max(...data.map((d) => d[valueKey])) / niceStep) * niceStep);
  const n = data.length;

  const x = (i) => padL + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW);
  const y = (v) => padT + plotH - (v / maxVal) * plotH;

  const yTicks = [0, maxVal / 4, maxVal / 2, (maxVal * 3) / 4, maxVal].map((v) => Math.round(v * 10) / 10);
  const gridLines = yTicks.map((t) => `
    <line x1="${padL}" y1="${y(t).toFixed(2)}" x2="${W - padR}" y2="${y(t).toFixed(2)}" class="gridline"></line>
    <text x="${padL - 8}" y="${(y(t) + 4).toFixed(2)}" class="axis-label" text-anchor="end">${fmtTick(t)}</text>
  `).join('');

  const step = Math.max(1, Math.ceil(n / 10));
  const xLabels = data.map((d, i) => (i % step === 0 || i === n - 1)
    ? `<text x="${x(i).toFixed(2)}" y="${H - 8}" class="axis-label" text-anchor="middle">${d.date.slice(5)}</text>`
    : ''
  ).join('');

  const pathD = data.map((d, i) => `${i === 0 ? 'M' : 'L'}${x(i).toFixed(2)},${y(d[valueKey]).toFixed(2)}`).join(' ');

  const dots = data.map((d, i) => `
    <circle class="dot" cx="${x(i).toFixed(2)}" cy="${y(d[valueKey]).toFixed(2)}" r="4"
      data-date="${d.date}" data-numerator="${d.numerator}" data-denominator="${d.denominator}" data-rate="${d.rate}"
      data-locked-seat-users="${d.lockedSeatUsers ?? ''}"></circle>
  `).join('');

  chartArea.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" class="chart-svg" role="img" aria-label="${ariaLabel}">
      ${gridLines}
      <path class="line-path" d="${pathD}"></path>
      ${dots}
      ${xLabels}
    </svg>
  `;

  const tt = document.getElementById('tt');
  chartArea.querySelectorAll('.dot').forEach((dot) => {
    dot.addEventListener('mousemove', (e) => {
      tt.innerHTML = fmtTooltip(dot.dataset);
      tt.style.left = (e.clientX + 14) + 'px';
      tt.style.top = (e.clientY - 10) + 'px';
      tt.style.opacity = 1;
    });
    dot.addEventListener('mouseleave', () => { tt.style.opacity = 0; });
  });
}

function renderChart(data) {
  drawLineChart('chartArea', data, {
    valueKey: 'rate',
    fmtTick: (t) => `${t}%`,
    fmtTooltip: ({ date, numerator, denominator, rate }) => `<b>${date}</b><br>跨店率 ${rate}%　(${numerator}/${denominator})`,
    ariaLabel: '回兴店跨店率趋势',
  });
}

function renderDenomChart(data) {
  drawLineChart('chartAreaDenom', data, {
    valueKey: 'denominator',
    fmtTick: (t) => `${t}`,
    fmtTooltip: ({ date, denominator }) => `<b>${date}</b><br>有效套餐数量 ${denominator}`,
    ariaLabel: '回兴店有效套餐数量趋势',
    niceStep: 10,
  });
}

function renderLockedChart(data) {
  // 老数据没有 lockedSeatUsers 字段（还没跑 recompute-locked-seats.js 补算过）时兜底成0，
  // 避免 Math.max(...) 算出 NaN 把整张图画坏
  const normalized = data.map((d) => ({ ...d, lockedSeatUsers: d.lockedSeatUsers ?? 0 }));
  drawLineChart('chartAreaLocked', normalized, {
    valueKey: 'lockedSeatUsers',
    fmtTick: (t) => `${t}`,
    fmtTooltip: ({ date, lockedSeatUsers }) => `<b>${date}</b><br>锁座用户 ${lockedSeatUsers}`,
    ariaLabel: '回兴店锁座用户趋势',
    niceStep: 5,
  });
}

// 单笔订座订单跨度超过3天算锁座订单（不看卡种），数据来自 gen-local-detail.js 生成的
// window.LOCAL_LOCKED_ORDERS（含手机号，本地专用，不进公开仓库）。判定"代客下单锁座"还是
// "小程序下单锁座"用的是订单的 paymentMethod 字段，具体判定依据见 lib.js 的 classifyLockedOrderBookingType()
// 注释——这块本身是靠真实抓包验证过的，不是瞎猜的。
let lockedOrderMask = lsGet('lockedOrderMask', true);
let selectedBookingType = lsGet('selectedBookingType', null); // 点了预定方式条形统计的色块时选中的类型，筛选下方表格

  const body = document.getElementById('lockedOrderBody');
  const orders = window.LOCAL_LOCKED_ORDERS;
  if (!orders) {
    body.innerHTML = `
      <p class="desc">本地未生成数据——线上看板不含这块内容，只有本地跑过生成脚本才能看到。</p>
      <div class="warn">在 <code>cross-store-rate</code> 目录下跑：<code>FUNC_SHARED_SECRET=xxx node gen-local-detail.js</code>，
      跑完刷新这个页面即可看到明细（生成的数据文件 <code>local-detail-data.js</code> 只存在本地，不会被提交/公开）。</div>
    `;

  }
  const genDate = window.LOCAL_DETAIL_GENERATED_AT || '未知日期';
  const savedLockedSearch = lsGet('lockedSearch', '');
  body.innerHTML = `
    <div class="warn">⚠️ 这块含真实客户手机号，只在本地看，别截图/公开分享——数据生成于 ${genDate}，共 ${orders.length} 条锁座订单
    （单笔订座订单时间跨度超过3天，已取消的订单不算）。</div>
    <p class="desc">"预定方式"根据订单支付方式字段判断：支付方式是"6"/"8"（实测都是线下结算/代客下单相关）
    算"代客下单锁座"，其他算"小程序下单锁座"——这个判断依据是真实抓包验证过的，见 <code>lib.js</code> 注释。</p>
    <div class="detail-controls">
      <label>手机号/昵称/座位号筛选 <input type="text" id="lockedSearch" placeholder="模糊搜索" value="${escapeHtml(savedLockedSearch)}" /></label>
      <button class="toggle${lockedOrderMask ? ' active' : ''}" id="lockedMaskBtn">${lockedOrderMask ? '手机号已打码' : '手机号明文'}</button>
    </div>
    <div class="kpi-row" id="lockedKpiRow" style="grid-template-columns: repeat(2, 1fr); max-width: 480px;"></div>
    <p class="desc" style="margin-top:4px;">下面是预定方式的占比，点击色块可以筛选下方表格</p>
    <div id="lockedCompArea"></div>
    <div class="scroll-table" id="lockedTableArea"></div>

  document.getElementById('lockedSearch').addEventListener('input', (e) => { lsSet('lockedSearch', e.target.value); renderLockedOrders(); });
  const maskBtn = document.getElementById('lockedMaskBtn');
  maskBtn.addEventListener('click', () => {
    lockedOrderMask = !lockedOrderMask;
    maskBtn.textContent = lockedOrderMask ? '手机号已打码' : '手机号明文';
    maskBtn.classList.toggle('active', lockedOrderMask);
    lsSet('lockedOrderMask', lockedOrderMask);
    renderLockedOrders();
  });
  renderLockedOrders();
}

const BOOKING_TYPE_META = {
  '代客下单锁座': { color: 'var(--booking-offline)', tagClass: 'tag-offline' },
  '小程序下单锁座': { color: 'var(--booking-online)', tagClass: 'tag-online' },
};

function renderLockedOrders() {
  const orders = window.LOCAL_LOCKED_ORDERS;
  if (!orders) return;
  const q = document.getElementById('lockedSearch').value.trim().toLowerCase();
  const filtered = q
    ? orders.filter((r) => (r.phone || '').includes(q) || (r.nickName || '').toLowerCase().includes(q) || String(r.seatName || '').toLowerCase().includes(q))
    : orders;

  // 预定方式占比始终基于搜索筛选，不受"点色块选中类型"影响
  const typeCounts = {};
  for (const r of filtered) typeCounts[r.bookingType] = (typeCounts[r.bookingType] || 0) + 1;
  const compItems = Object.keys(typeCounts).map((type) => ({
    key: type, label: type, count: typeCounts[type], color: BOOKING_TYPE_META[type].color,
  }));
  renderCompositionBar('lockedCompArea', compItems, selectedBookingType, (key) => {
    selectedBookingType = selectedBookingType === key ? null : key;
    lsSet('selectedBookingType', selectedBookingType);
    renderLockedOrders();
  }, '锁座订单按预定方式占比，点击色块可筛选下方表格', 'locked');

  const tableRows = selectedBookingType ? filtered.filter((r) => r.bookingType === selectedBookingType) : filtered;
  const uniqueUsers = new Set(tableRows.map((r) => r.phone)).size;

  document.getElementById('lockedKpiRow').innerHTML = `
    <div class="kpi"><div class="kpi-label">锁座订单数${selectedBookingType ? '（已筛选）' : ''}</div><div class="kpi-value">${tableRows.length}</div></div>
    <div class="kpi"><div class="kpi-label">涉及用户数(去重)</div><div class="kpi-value">${uniqueUsers}</div></div>
  `;

  const el = document.getElementById('lockedTableArea');
  if (!tableRows.length) {
    el.innerHTML = '<div class="empty">这个条件下没有数据</div>';
    return;
  }
  const sorted = [...tableRows].sort((a, b) => (a.start > b.start ? -1 : 1)); // 最近开始的排前面
  const rows = sorted.map((r) => {
    const meta = BOOKING_TYPE_META[r.bookingType];
    return `
    <tr>
      <td>${lockedOrderMask ? maskPhone(r.phone) : r.phone}</td>
      <td>${r.nickName || ''}</td>
      <td class="num">${r.seatName || ''}</td>
      <td class="num">${r.start}</td>
      <td class="num">${r.end}</td>
      <td class="num">${r.spanDays}天</td>
      <td class="num">${r.paymentMethod ?? ''}</td>
      <td><span class="tag ${meta.tagClass}">${r.bookingType}</span></td>
    </tr>
  `;
  }).join('');
  el.innerHTML = `
    <table>
      <thead><tr><th>手机号</th><th>昵称</th><th class="num">座位号</th><th class="num">开始日期</th><th class="num">结束日期</th><th class="num">跨度</th><th class="num">支付方式</th><th>预定方式</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

loadData();
initUserDetailCard();
initLockedOrderCard();
</script>
</body>
</html>
