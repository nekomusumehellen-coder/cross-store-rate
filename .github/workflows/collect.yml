name: 跨店率每日结算

on:
  schedule:
    # 北京时间每天10:00（算前一天的数据）。2026-08-08 实测过凌晨00:30跑太早——那天跨店结算数据
    # 还没同步完整，查出来是0条，好几天后再查才有真实的14条，所以往后挪留够10小时缓冲，
    # 具体要多久才能稳定同步完还不确定，以后再发现类似问题就继续往后挪。
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 运行结算脚本
        env:
          FUNC_SHARED_SECRET: ${{ secrets.FUNC_SHARED_SECRET }}
        run: node collect.js

      - name: 提交 history.json / history.js
        run: |
          git config user.name "cross-store-rate-bot"
          git config user.email "actions@github.com"
          git add history.json history.js
          git diff --cached --quiet || git commit -m "更新跨店率数据 [skip ci]"
          git push

  deploy-pages:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: 拉取最新（含刚提交的 history.json）
        run: git pull

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
